name: gates

# Hop3 CI gates — closes the post-merge obligations recorded in
# docs/handoffs/STAGE-1.md §13: the full-workspace typecheck and the
# complete workspace build (including the two production bundles whose
# peak memory exceeds the 4G dev sandbox) on a runner with enough RAM,
# plus the repository's own gate set. Every command below mirrors the
# repository's own scripts and the README "Upstream engineering gates"
# list; nothing is invented by analogy (HOP3_RULES §8).
#
# Deliberately out of scope (maintainer duties, honestly recorded):
#   - the desktop E2E release-track matrix (Windows shards / coverage runs —
#     see README.en.md and scripts/run-windows-e2e-shards.mjs);
#   - the login-gated in-shell earner journey — needs a real Z.AI account.
#
# In scope since the seventh TL session: the upstream-documented desktop
# Electron E2E container demo (default preset, replay-isolated network) as a
# second job — see the desktop-e2e-container job below.
#
# In scope since the eighth TL session: the two replay-admitted container
# presets — conversation-session-verified (25 specs) and plugins-verified
# (1 spec) — as a third job; see the desktop-e2e-presets job below. The
# preset lists are the script's own admission records, so the job deepens
# container coverage without inventing a spec selection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      # The root typecheck chain runs a single tsc -b process over the whole
      # project list; the default V8 heap aborts on large trees (recorded in
      # docs/handoffs/evidence/earn-port-verification.md §5). 4G of old-space
      # headroom is what the fifth TL session used per chunk and is safe on
      # hosted runners.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout (full history for architecture merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm (pinned by packageManager field)
        uses: pnpm/action-setup@v4

      - name: Node (pinned by .nvmrc) with pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: "Bootstrap (README install path — install + runtime prep + build:bootstrap)"
        # Observed on the first run (2026-11-12): ERR_PNPM_ENOENT rename
        # 'node_modules/tsup/node_modules/_tmp_*' -> 'node_modules/tsup/node_modules/esbuild'
        # — a transient pnpm hoisted-linker race while concurrent native
        # postinstall scripts (node-pty, esbuild, cpu-features, electron) run
        # on fast multicore runners. Retry is bounded and each retry emits a
        # visible warning annotation, so a deterministic failure (three
        # identical failures) still fails the job loudly.
        run: |
          for attempt in 1 2 3; do
            if pnpm bootstrap; then exit 0; fi
            echo "::warning::pnpm bootstrap attempt ${attempt} failed — retrying (known hoisted-linker ENOENT flake)"
            sleep 5
          done
          exit 1

      - name: Node version assertion (repository's own CI script)
        run: pnpm run ci:assert-node

      - name: Lint (oxlint + session-control boundary)
        run: pnpm run lint

      - name: Stale doc phrases check
        run: pnpm run docs:stale-phrases:check

      - name: Architecture governance tests
        run: pnpm run test:architecture

      - name: SQLite schema contract
        run: pnpm run db:schema:check

      - name: Architecture check (changed files vs base)
        run: pnpm run architecture:check -- --changed
        env:
          # PRs diff against origin/main (merge-base). Pushes to main diff
          # against the previous tip (github.event.before).
          ARCHITECTURE_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}

      - name: Full-workspace typecheck (project list from package.json)
        run: pnpm run typecheck

      - name: Engineering tests
        run: pnpm run test:engineering

      # Advisory on purpose: 1605 files already fail fmt:check on the imported
      # baseline (docs/handoffs/evidence/baseline-import-verification.md; the
      # fifth TL session re-confirmed the drift on 2026-11-12, and the runner
      # reproduced the identical count). Reformatting them would be an
      # unrelated repo-wide reformat upstream never asked for (HOP3_RULES §8),
      # so the step stays visible but non-blocking until maintainers remediate
      # the drift. The step is marked failed-but-allowed in the run UI and the
      # full file list is in the step log — it still surfaces new drift instead
      # of silently passing.
      - name: "Format check (advisory — pre-existing upstream drift)"
        run: pnpm run fmt:check
        continue-on-error: true

      - name: Full workspace build (all packages, incl. @zcode/web vite + desktop bundles)
        run: pnpm run build

  # The upstream-documented Docker demo path (root command `pnpm
  # test:e2e:container` → scripts/test-desktop-e2e-container.sh) on
  # ubuntu-latest: builds Dockerfile.desktop-e2e (node:24.14.0-bookworm +
  # Electron/Xvfb/dbus deps + frozen-lockfile install), prefetches the matching
  # Chromedriver, then runs the replay-safe portion of the default preset
  # inside the container with `--network none` (E2E_PROVIDER_HTTP_MODE=replay)
  # — headless boot, UI smoke (v4 session pane + composer), e2ecase regression,
  # and one ui-shell navigation spec. No credentials and no live network are
  # used by the tests. This exercises the desktop Electron shell end to end;
  # the release-track matrix stays a maintainer duty.
  desktop-e2e-container:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free runner disk (hosted toolcache is dead weight for a Docker-only job)
        # The e2e image carries its own toolchain; the preinstalled
        # Android/.NET toolcache (~20GB) only risks exhausting the runner disk
        # under the image + node_modules (~5GB). Purely additive headroom.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -h /

      - name: Checkout (workspace as Docker build context)
        uses: actions/checkout@v4
        with:
          # No merge-base or git metadata is needed here: .dockerignore excludes
          # .git from the image and build-metadata.mjs falls back to ZCODE_COMMIT
          # ("unknown") when git is absent — the upstream demo path is designed
          # to run exactly like this.
          fetch-depth: 1

      - name: "Run desktop E2E container demo (replay-safe specs, replay-isolated)"
        # E2E_SPEC is the script's own documented spec-selection knob. The value
        # below is DEFAULT_E2E_SPEC verbatim minus one entry:
        # infrastructure/smoke/upstream-provider.test.ts. That spec is hardcoded
        # to capture mode by resolveUpstreamE2EHttpModeForWorker — it validates
        # the REAL upstream provider and therefore requires E2E_PROVIDER_API_KEY
        # plus live network (capture mode is opt-in by design). Observed on the
        # first run (2026-11-12): under replay isolation it fails with
        # "Manual review defaults to capture" and "没有捕获到 上游 请求" while
        # the other four specs pass. It stays a credential-gated maintainer
        # check; the conversation-session-verified / plugins-verified container
        # presets (replay-admitted specs) run in the separate
        # desktop-e2e-presets job below.
        env:
          E2E_SPEC: "./test/e2e/infrastructure/smoke/container-boot.test.ts,./test/e2e/infrastructure/smoke/smoke.test.ts,./test/e2e/infrastructure/smoke/e2ecase-regression.test.ts,./test/e2e/ui-shell/navigation/task-list-archive-confirmation.test.ts"
        # Bounded retry: two observed same-machine transients on the PR #11
        # docs runs (43401986960 / 43404465419) — the
        # task-list-archive-confirmation spec flaked once on a tooltip
        # click-intercept (its first flake in ~13 runs), and the image build
        # hit the pnpm hoisted-linker ENOENT rename race the bootstrap and
        # plugins steps already retry. A step-level retry with a fresh docker
        # run addresses both classes. Same shape as the other bounded retries
        # in this workflow: three attempts, visible warning annotation each,
        # loud failure if deterministic.
        run: |
          for attempt in 1 2 3; do
            if bash scripts/test-desktop-e2e-container.sh; then exit 0; fi
            echo "::warning::container demo attempt ${attempt} failed — retrying (observed transients: image-build pnpm hoisted-linker ENOENT race; task-list-archive-confirmation tooltip click-intercept flake)"
            sleep 5
          done
          exit 1

      - name: Upload E2E artifacts (reports, network capture, perf samples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: packages/desktop/.e2e-artifacts/
          # The artifact root is a dot-directory (.e2e-artifacts); the action's
          # default include-hidden-files=false silently matched nothing on the
          # first run even though the bind mount had produced the files.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The two replay-admitted presets the upstream script itself registers —
  # the eighth TL session's deeper container coverage. The preset lists in
  # scripts/test-desktop-e2e-container.sh are admission records: only specs
  # with their own Docker replay-isolated green evidence get written into
  # them (CONVERSATION_SESSION_VERIFIED_E2E_SPEC — 25 specs; and
  # PLUGIN_MANAGEMENT_VERIFIED_E2E_SPEC — 1 spec; the script's own comments
  # and packages/desktop/test/desktopE2EContainerScript.test.ts enforce that
  # discipline). The job invokes the script with its own preset positional
  # argument — the exact form the package.json scripts
  # test:e2e:container:conversation / test:e2e:container:plugins use — and
  # leaves E2E_SPEC unset, so the admitted preset, not an ad-hoc list, is the
  # selection source of truth. Deliberately a separate job from
  # desktop-e2e-container: the existing green gate keeps its blast radius,
  # and any failure in the deeper presets is a contained, honest signal.
  desktop-e2e-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free runner disk (hosted toolcache is dead weight for a Docker-only job)
        # Same rationale as the desktop-e2e-container job: the e2e image
        # carries its own toolchain; the preinstalled Android/.NET toolcache
        # (~20GB) only risks exhausting the runner disk under the image +
        # node_modules (~5GB). Purely additive headroom.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -h /

      - name: Checkout (workspace as Docker build context)
        uses: actions/checkout@v4
        with:
          # Same shape as the desktop-e2e-container job: no merge-base or git
          # metadata is needed — .dockerignore excludes .git from the image
          # and build-metadata.mjs falls back to ZCODE_COMMIT ("unknown")
          # when git is absent.
          fetch-depth: 1

      - name: "Run plugins-verified preset (1 admitted spec — fast fail first)"
        # bash + the script's own preset positional argument; no host pnpm is
        # needed (the Docker image carries the frozen-lockfile install),
        # mirroring the desktop-e2e-container job's invocation shape. This
        # first invocation builds the image and prefetches the matching
        # Chromedriver, exactly like the existing job's run.
        #
        # Bounded retry: the image build runs the Dockerfile's `pnpm install
        # --frozen-lockfile`, which is subject to the same transient pnpm
        # hoisted-linker ENOENT rename race the gates-and-build bootstrap
        # step already diagnosed and retried (PR #6; observed again here on
        # run 43381256531: ERR_PNPM_ENOENT rename
        # 'node_modules/tsup/node_modules/_tmp_*' ->
        # 'node_modules/tsup/node_modules/esbuild' during concurrent native
        # postinstalls). The Dockerfile is upstream's own product file and
        # stays untouched; the workflow-level bounded retry is the fix of
        # choice. Each attempt emits a visible warning annotation, so a
        # deterministic failure (three identical failures) still fails the
        # job loudly.
        run: |
          for attempt in 1 2 3; do
            if bash scripts/test-desktop-e2e-container.sh plugins-verified; then exit 0; fi
            echo "::warning::plugins preset attempt ${attempt} failed — retrying (known pnpm hoisted-linker ENOENT race inside the image build; same family as the gates-and-build bootstrap retry)"
            sleep 5
          done
          exit 1

      - name: "Run conversation-session-verified preset (25 admitted specs)"
        # SKIP_IMAGE_BUILD is the script's own documented repeat-run knob
        # (docs/testing/desktop-e2e-container.md): the image built by the
        # plugins step is current — same checkout, same Dockerfile — so the
        # conversation pass reuses it instead of paying the build again; the
        # driver cache volume is warm from the prefetch. Each docker run
        # writes its own .e2e-artifacts/<run-id>/ directory (timestamped
        # run ids), so both passes land in the single artifact upload below.
        # No per-spec duration was recorded upstream for these 25 workflow
        # specs; the 120-minute timeout is sized from the 90-minute sibling
        # job plus generous headroom, and the first observed run will inform
        # any adjustment.
        #
        # Blocking again — the eventual-consistency race is fixed at the
        # spec. History: this step was advisory for five runs because runs
        # 43382685315 and 43386905150 (three attempts, same runner) failed
        # the resume spec on countUpstreamRequests(...) === 0: the count
        # helper reads the replay capture-artifact FILE, and the network
        # capture proxy queues each artifact write without awaiting it
        # (writeArtifact is fire-and-forget by design), so a read taken
        # right after the UI's turn closes can still see the pre-request
        # file. The durable fix — applied in the resume spec now — wraps the
        # positive exact-count assertions in expectUpstreamRequestCount-
        # Eventually (browser.waitUntil) so they poll until the artifact
        # reflects the already-completed turn, matching how every other
        # capture read in the suite already waits. Zero-count assertions
        # stay immediate by design (a lagging file cannot fail them). A
        # second eventual-consistency layer surfaced on the first blocking
        # run (43515223461): the notification-row DOM renders after the
        # turn closes (resume DWU-03 read the row at 0 with the capture
        # record already present), and the amend spec's side-pane chip
        # timed out when a card re-render swallowed the open-details click
        # — both now also poll (expectNotificationRowsEventually; re-open
        # the pane only while the pane is provably closed). The de-advisory
        # evidence is this step's own blocking run on the fix commits.
        env:
          SKIP_IMAGE_BUILD: "1"
        run: bash scripts/test-desktop-e2e-container.sh conversation-session-verified

      - name: "Normalize artifact permissions (container writes as root; plugin test dirs land 0700)"
        # First-run observation (run 43377638853): the plugin-ui-session-ready spec
        # creates its test workspace inside the bind-mounted artifact root with
        # owner-only permissions (written by the container's root user), so
        # actions/upload-artifact@v4 — running as the runner user — fails with
        # EACCES: permission denied, scandir .../plugin-ui-session-ready-*.
        # The artifacts are replay-fixture reports from a --network none run
        # (no credentials ever enter the container), so making them
        # world-readable-for-upload loses nothing. a+rX adds read for everyone
        # and traversal on directories only — never execute bits on files.
        if: always()
        run: sudo chmod -R a+rX packages/desktop/.e2e-artifacts/ || true

      - name: Upload E2E artifacts (reports, network capture, perf samples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-presets-artifacts
          path: packages/desktop/.e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
